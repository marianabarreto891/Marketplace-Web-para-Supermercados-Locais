<div class="auth-container">
  <h2>Entrar na conta</h2>
  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" placeholder="O teu email" />
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" [(ngModel)]="password" placeholder="A tua password" />
  </div>
  <button (click)="onSubmit()">Entrar</button>
  <p>Não tens conta? <a routerLink="/register">Registar</a></p>
</div>
