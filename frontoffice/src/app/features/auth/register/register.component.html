<div class="auth-container">
  <h2>Criar conta</h2>
  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="success" *ngIf="success">{{ success }}</div>
  <div class="form-group">
    <label>Nome</label>
    <input type="text" [(ngModel)]="name" placeholder="O teu nome" />
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" placeholder="O teu email" />
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" [(ngModel)]="password" placeholder="A tua password" />
  </div>
  <div class="form-group">
    <label>Morada</label>
    <input type="text" [(ngModel)]="address" placeholder="A tua morada" />
  </div>
  <div class="form-group">
    <label>Telefone</label>
    <input type="text" [(ngModel)]="phone" placeholder="O teu telefone" />
  </div>
  <button (click)="onSubmit()">Registar</button>
  <p>Já tens conta? <a routerLink="/login">Entrar</a></p>
</div>
