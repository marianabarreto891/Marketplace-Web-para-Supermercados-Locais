<div class="auth-container">
  <h2>Criar conta</h2>

  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="success" *ngIf="success">{{ success }}</div>

  <div class="form-group">
    <label>Nome</label>
    <input
      type="text"
      [(ngModel)]="name"
      placeholder="O teu nome"
      [class.input-error]="fieldErrors.name"
    />
    <span class="field-error" *ngIf="fieldErrors.name">{{ fieldErrors.name }}</span>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      [(ngModel)]="email"
      placeholder="O teu email"
      [class.input-error]="fieldErrors.email"
    />
    <span class="field-error" *ngIf="fieldErrors.email">{{ fieldErrors.email }}</span>
  </div>

  <div class="form-group">
    <label>Password</label>
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="A tua password (mín. 6 caracteres)"
      [class.input-error]="fieldErrors.password"
    />
    <span class="field-error" *ngIf="fieldErrors.password">{{ fieldErrors.password }}</span>
  </div>

  <div class="form-group">
    <label>Morada</label>
    <input
      type="text"
      [(ngModel)]="address"
      placeholder="A tua morada"
      [class.input-error]="fieldErrors.address"
    />
    <span class="field-error" *ngIf="fieldErrors.address">{{ fieldErrors.address }}</span>
  </div>

  <div class="form-group">
    <label>Telefone</label>
    <input
      type="text"
      [(ngModel)]="phone"
      placeholder="9 dígitos (ex: 912345678)"
      maxlength="9"
      [class.input-error]="fieldErrors.phone"
    />
    <span class="field-error" *ngIf="fieldErrors.phone">{{ fieldErrors.phone }}</span>
  </div>

  <button (click)="onSubmit()">Registar</button>
  <p>Já tens conta? <a routerLink="/login">Entrar</a></p>
</div>
