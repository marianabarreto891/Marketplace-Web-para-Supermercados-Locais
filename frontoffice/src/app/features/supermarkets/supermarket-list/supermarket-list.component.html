<section class="container py-4">
  <h1 class="mb-2">Supermercados</h1>
  <p class="text-muted mb-4">Escolha um supermercado para ver os seus produtos e reviews.</p>

  <div *ngIf="loading()">A carregar...</div>
  <div *ngIf="errorMessage()" class="alert alert-danger">{{ errorMessage() }}</div>

  <div class="row g-3" *ngIf="!loading() && supermarkets().length > 0">
    <div class="col-md-4" *ngFor="let s of supermarkets()">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ s.name }}</h5>
          <span class="text-muted mb-3">{{ s.location }}</span>
          <a [routerLink]="['/supermarkets', s._id]" class="btn btn-outline-primary mt-auto">
            Ver supermercado
          </a>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading() && supermarkets().length === 0" class="text-muted">
    Não há supermercados disponíveis.
  </div>
</section>
